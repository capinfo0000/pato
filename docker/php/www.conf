; php-fpm プール設定（既定の www.conf を上書きする）
[www]
user = www-data
group = www-data

; nginx コンテナから TCP で受ける
listen = 0.0.0.0:9000

; 小〜中規模想定。負荷を見て調整する
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; リクエストを捌くたびに再生成し、メモリリークを溜め込まない
pm.max_requests = 500

; ログはコンテナの標準エラーへ（docker logs / 集約基盤で拾う）
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; ヘルスチェック・状態確認用（nginx 側で外部に出さない）
pm.status_path = /fpm-status
ping.path = /fpm-ping
