# pato岡山 の nginx 設定。
# TLS は前段（Caddy / 既存のリバースプロキシ / ロードバランサ）で終端する前提。
# ここは HTTP を受けて php-fpm に渡すだけに徹する。

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # nginx のバージョンを出さない
    server_tokens off;

    # 決済まわりで大きなボディは受けない（php.ini の post_max_size と揃える）
    client_max_body_size 8M;

    # 実クライアントIPを php 側へ渡す（レート制限が全部プロキシのIPになるのを防ぐ）
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
    real_ip_recursive on;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 静的ファイルは長期キャッシュ。ただし Service Worker と manifest は
    # 更新が即座に効かないと困るので除外する
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Webhook や決済で php 側が待たされても切らない程度に
        fastcgi_read_timeout 60s;
    }

    # php-fpm の状態は外に出さない
    location ~ ^/(fpm-status|fpm-ping)$ {
        deny all;
    }

    # ドットファイル（.env や .git が万一 public に置かれても読ませない）
    location ~ /\. {
        deny all;
    }
}
